<script>
const ACCESS_CODE = "ipadkid";

const RELEASED_EPISODES = [
  {
    season: "s1",
    title: "Season 1 Trailer",
    id: "yc4HMOTrnJM",
    description: "The Season 1 Trailer for The Cousins.",
    trailer: true
  },
  {
    season: "s1",
    title: "S1E1 — iPad Kid",
    id: "qurSAnPhyno",
    description: "The iPad kid keeps interrupting Cole and Max’s advertisements."
  },
  {
    season: "s1",
    title: "S1E2 — Probably Adopted",
    id: "nX8M5bJiuJE",
    description: "Max's cousins act incredibly disgusting and stupid, while Max begins to believe he was adopted into this insane family."
  },
  {
    season: "s1",
    title: "S1E3 — Maximum Possibilities AI",
    id: "J58p2_q4xxc",
    description: "Cole builds an AI that looks uncannily like Max, and the result is something incredible. His brother and he start to notice weird, uncanny things happening. This philosophical zombie appears to know everything, yet may understand nothing at all."
  },
  {
    season: "s1",
    title: "S1E4 — When you try to make a movie with 2 lunatics",
    id: "iEpw6GQsoEw",
    description: "Max attempts to make a movie, but chaos occurs when he invites his cousins to do it with him."
  },
  {
    season: "s1",
    title: "S1E5 — What Not To Do At A Wedding",
    id: "NUBbyuQa9cE",
    description: "Cole, Leo and Max go to a wedding and get into shenanigans."
  },
  {
    season: "s1",
    title: "S1E6 — The Stupid Games",
    id: "yGKOOUXx9QQ",
    description: "The cousins enter a game where they have to fight each other to the death."
  }
];

const UNRELEASED_EPISODES = [
  {
    season: "s2",
    title: "S2E1 — Dawn of iPad Kid",
    url: "https://drive.google.com/file/d/16Q15VAc4u3SJ00GXiN6ixnp9s4Cba7-V/preview",
    description: "Leo discovers iPad."
  },
  {
    season: "s2",
    title: "S2E2 — Toe Muncher",
    url: "https://drive.google.com/file/d/1Zpfl013uaWhlBm0ua-13k_Ns45dZsgCV/preview",
    description: "Max finds out his family is just a chain of increasingly insane relatives, and chaos occurs when his doorbell rings."
  },
  {
    season: "s2",
    title: "S2E3 — Saved",
    url: "https://drive.google.com/file/d/1NDLmAbTEFC01jSewOl90Z98E6ej54ueW/preview",
    description: "Max buys a hub and Cole sees what happens when it is plugged into itself. Incredible things happen."
  }
];

const episodes = [
  ...RELEASED_EPISODES.map(ep => ({
    ...ep,
    released: true,
    type: "youtube"
  })),

  ...UNRELEASED_EPISODES.map(ep => ({
    ...ep,
    released: false,
    type: "drive"
  }))
];

let currentSeason = "s1";
let current = -1;
let unlocked = sessionStorage.getItem("cousinsUnlocked") === "yes";

const player = document.getElementById("player");
const placeholder = document.getElementById("placeholder");
const title = document.getElementById("title");
const meta = document.getElementById("meta");
const kicker = document.getElementById("kicker");
const list = document.getElementById("list");
const search = document.getElementById("search");
const count = document.getElementById("count");
const status = document.getElementById("status");

const prev = document.getElementById("prev");
const next = document.getElementById("next");
const restart = document.getElementById("restart");

const unreleasedButton = document.getElementById("unreleasedButton");

const passwordModal = document.getElementById("passwordModal");
const passwordForm = document.getElementById("passwordForm");
const codeInput = document.getElementById("codeInput");
const gateError = document.getElementById("gateError");
const closeModal = document.getElementById("closeModal");


/* -----------------------------
   Utility
----------------------------- */

function seasonName(season) {
  return season === "s2" ? "Season 2" : "Season 1";
}


/* -----------------------------
   Visible episode list
----------------------------- */

function visibleEpisodes() {
  const query = search.value.trim().toLowerCase();

  return episodes.filter(ep => {
    // Only show the currently selected season.
    if (ep.season !== currentSeason) {
      return false;
    }

    // Hide unreleased episodes until unlocked.
    if (!ep.released && !unlocked) {
      return false;
    }

    // Search.
    if (!query) {
      return true;
    }

    return (
      ep.title.toLowerCase().includes(query) ||
      ep.description.toLowerCase().includes(query)
    );
  });
}


/* -----------------------------
   Render episode list
----------------------------- */

function render() {
  const visible = visibleEpisodes();

  list.replaceChildren();

  if (!visible.length) {
    const empty = document.createElement("div");

    empty.className = "emptylist";

    if (currentSeason === "s2" && !unlocked) {
      empty.textContent = "Season 2 is coming soon.";
    } else {
      empty.textContent = "No episodes found.";
    }

    list.appendChild(empty);
  }

  visible.forEach((ep, index) => {
    const realIndex = episodes.indexOf(ep);

    const button = document.createElement("button");

    button.type = "button";

    button.className =
      "item" +
      (realIndex === current ? " active" : "") +
      (!ep.released ? " unreleased" : "");

    /* Episode number */

    const number = document.createElement("span");

    number.className = "num";

    const match = ep.title.match(
      /(?:episode|ep|e)?\s*0*(\d+)/i
    );

    number.textContent = match
      ? String(Number(match[1])).padStart(2, "0")
      : String(index + 1).padStart(2, "0");


    /* Episode information */

    const info = document.createElement("span");

    const name = document.createElement("span");

    name.className = "name";
    name.textContent = ep.title;

    if (!ep.released) {
      const label = document.createElement("span");

      label.className = "unreleased-label";
      label.textContent = "UNRELEASED";

      name.appendChild(label);
    }

    const file = document.createElement("div");

    file.className = "file";

    file.textContent = ep.released
      ? "YouTube"
      : "Private screening";

    info.append(name, file);


    /* Arrow */

    const arrow = document.createElement("span");

    arrow.className = "arrow";

    arrow.textContent =
      realIndex === current ? "▶" : "›";


    button.append(number, info, arrow);

    button.addEventListener("click", () => {
      play(realIndex);
    });

    list.appendChild(button);
  });


  /* Episode count */

  const n = episodes.filter(ep =>
    ep.season === currentSeason &&
    (ep.released || unlocked)
  ).length;

  count.textContent =
    `${n} episode${n === 1 ? "" : "s"}`;
}


/* -----------------------------
   Previous / next navigation
----------------------------- */

function navigableIndex(fromIndex, direction) {
  if (
    fromIndex < 0 ||
    fromIndex >= episodes.length
  ) {
    return -1;
  }

  const season = episodes[fromIndex].season;

  let index = fromIndex + direction;

  while (
    index >= 0 &&
    index < episodes.length
  ) {
    const ep = episodes[index];

    /*
      Stay inside the same season.
    */

    if (ep.season !== season) {
      return -1;
    }

    /*
      Skip locked episodes.
    */

    if (ep.released || unlocked) {
      return index;
    }

    index += direction;
  }

  return -1;
}


/* -----------------------------
   Play an episode
----------------------------- */

function play(index) {
  if (
    index < 0 ||
    index >= episodes.length
  ) {
    return;
  }

  const ep = episodes[index];


  /*
    Don't allow locked episodes
    to be played directly.
  */

  if (!ep.released && !unlocked) {
    openPasswordModal();
    return;
  }


  current = index;
  currentSeason = ep.season;


  /*
    Update season tabs.
  */

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle(
      "active",
      tab.dataset.season === currentSeason
    );
  });


  /*
    Remove the old player.
  */

  player.replaceChildren();

  placeholder.classList.add("hidden");


  /*
    Create iframe.
  */

  const frame = document.createElement("iframe");

  frame.title = `The Cousins — ${ep.title}`;

  frame.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

  frame.allowFullscreen = true;

  frame.referrerPolicy =
    "strict-origin-when-cross-origin";

  frame.style.width = "100%";
  frame.style.height = "100%";
  frame.style.border = "0";
  frame.style.display = "block";


  /*
    YouTube episode.
  */

  if (ep.type === "youtube") {
    frame.src =
      `https://www.youtube.com/embed/${encodeURIComponent(ep.id)}` +
      `?playsinline=1&rel=0`;
  }


  /*
    Google Drive episode.
    
    The URL already uses /preview,
    which is the embeddable Drive player.
  */

  else if (ep.type === "drive") {
    frame.src = ep.url;
  }


  /*
    Safety fallback.
  */

  else {
    console.error("Unknown episode type:", ep.type);
    return;
  }


  player.appendChild(frame);


  /*
    Update episode information.
  */

  kicker.textContent =
    `${seasonName(ep.season)} · ` +
    `${ep.released ? "NOW SHOWING" : "UNRELEASED"}`;

  title.textContent = ep.title;

  meta.textContent = ep.description;


  /*
    Update navigation buttons.
  */

  prev.disabled =
    navigableIndex(index, -1) === -1;

  next.disabled =
    navigableIndex(index, 1) === -1;

  restart.disabled = false;


  /*
    Update status.
  */

  if (ep.type === "youtube") {
    status.textContent =
      `${ep.title} is playing from YouTube.`;
  } else {
    status.textContent =
      `${ep.title} is playing from the private screening room.`;
  }


  /*
    Refresh the episode list so the
    active episode gets highlighted.
  */

  render();
}


/* -----------------------------
   Password modal
----------------------------- */

function openPasswordModal() {
  passwordModal.classList.add("show");

  gateError.textContent = "";
  codeInput.value = "";

  setTimeout(() => {
    codeInput.focus();
  }, 50);
}


function closePasswordModal() {
  passwordModal.classList.remove("show");

  gateError.textContent = "";
  codeInput.value = "";
}


/* -----------------------------
   Unreleased button
----------------------------- */

function updateUnlockButton() {
  unreleasedButton.classList.toggle(
    "locked",
    !unlocked
  );

  unreleasedButton.classList.toggle(
    "unlocked",
    unlocked
  );

  unreleasedButton.textContent =
    "Watch unreleased";
}


/* -----------------------------
   Previous button
----------------------------- */

prev.addEventListener("click", () => {
  const index = navigableIndex(current, -1);

  if (index !== -1) {
    play(index);
  }
});


/* -----------------------------
   Next button
----------------------------- */

next.addEventListener("click", () => {
  const index = navigableIndex(current, 1);

  if (index !== -1) {
    play(index);
  }
});


/* -----------------------------
   Restart
----------------------------- */

restart.addEventListener("click", () => {
  if (current !== -1) {
    play(current);
  }
});


/* -----------------------------
   Season tabs
----------------------------- */

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    currentSeason = tab.dataset.season;

    /*
      Update active tab.
    */

    document.querySelectorAll(".tab").forEach(other => {
      other.classList.toggle(
        "active",
        other === tab
      );
    });


    /*
      If the currently playing episode
      isn't in this season, don't pretend
      it is selected in the new list.
    */

    if (
      current !== -1 &&
      episodes[current].season !== currentSeason
    ) {
      current = -1;

      player.replaceChildren();

      placeholder.classList.remove("hidden");

      title.textContent = "No episode selected";

      meta.textContent =
        "Choose an episode from the list.";

      kicker.textContent = "NOW SHOWING";

      prev.disabled = true;
      next.disabled = true;
      restart.disabled = true;

      status.textContent =
        `${seasonName(currentSeason)} is ready — choose an episode to begin watching.`;
    }

    render();
  });
});


/* -----------------------------
   Search
----------------------------- */

search.addEventListener("input", render);


/* -----------------------------
   Watch unreleased
----------------------------- */

unreleasedButton.addEventListener("click", () => {

  /*
    If not unlocked, show password.
  */

  if (!unlocked) {
    openPasswordModal();
    return;
  }


  /*
    Switch to Season 2.
  */

  currentSeason = "s2";

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle(
      "active",
      tab.dataset.season === "s2"
    );
  });


  /*
    Clear search so all Season 2
    episodes are visible.
  */

  search.value = "";


  render();


  /*
    Start the first unreleased episode.
  */

  const first = episodes.findIndex(
    ep =>
      ep.season === "s2" &&
      !ep.released
  );

  if (first !== -1) {
    play(first);
  }
});


/* -----------------------------
   Password submission
----------------------------- */

passwordForm.addEventListener("submit", event => {
  event.preventDefault();

  const enteredCode =
    codeInput.value.trim().toLowerCase();


  if (
    enteredCode ===
    ACCESS_CODE.toLowerCase()
  ) {

    /*
      Unlock for this browser session.
    */

    unlocked = true;

    sessionStorage.setItem(
      "cousinsUnlocked",
      "yes"
    );


    updateUnlockButton();

    closePasswordModal();

    render();

    status.textContent =
      "Unreleased episodes unlocked — congratulations, primitive.";

  } else {

    gateError.textContent =
      "That code didn't work. Try again.";

    codeInput.select();
  }
});


/* -----------------------------
   Close modal button
----------------------------- */

closeModal.addEventListener(
  "click",
  closePasswordModal
);


/* -----------------------------
   Click outside modal
----------------------------- */

passwordModal.addEventListener(
  "click",
  event => {
    if (event.target === passwordModal) {
      closePasswordModal();
    }
  }
);


/* -----------------------------
   Escape key
----------------------------- */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      passwordModal.classList.contains("show")
    ) {
      closePasswordModal();
    }

  }
);


/* -----------------------------
   Initial setup
----------------------------- */

updateUnlockButton();
render();
</script>
